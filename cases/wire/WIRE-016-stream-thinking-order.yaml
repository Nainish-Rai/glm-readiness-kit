schema_version: 1
id: WIRE-016
title: "stream with thinking: reasoning arrives before the answer text and matches the non-stream length class"
category: wire/stream
severity: major
kind: deterministic
executor: paired_stream
applies_to:
  models: [glm-5.3, glm-5.3-flash]
  protocols: [openai_chat, anthropic_messages]
source:
  issues: []
  urls: ["https://docs.z.ai/guides/capabilities/thinking-mode.md"]
  spec: ["https://docs.z.ai/guides/capabilities/thinking-mode.md"]
  first_seen: 2026-10-26
modes: [stream]
request:
  messages:
    - {role: user, content: "What is 17 times 24? Think it through, then give the number."}
  max_tokens: 2048
  params: {thinking: {type: enabled}, reasoning_effort: low}
expect:
  default:
    - {check: http_status, equals: 200}
    - {check: sse_terminates}
    - {check: wire_reasoning_before_content}
    - {check: wire_stream_agrees_with_nonstream, max_ratio: 5}
notes: >
  The executor sends the request once non-stream (label nonstream) and once streamed (label stream, the
  default exchange). "Same length class" means within 5x on both content and reasoning, which tolerates
  sampling noise. Planted defect: reasoning-after-content.
