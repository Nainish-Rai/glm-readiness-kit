schema_version: 1
id: TOOL-013
title: "At 60k and 100k tokens of agent history an action that needs a tool still produces the call"
category: tools/forced-need
severity: major
kind: statistical
executor: tool_shape
executor_config:
  context_tokens: {default: 60000, ctx-100k: 100000}
  filler_tool: read_file
applies_to:
  models: [glm-5.3, glm-5.3-flash, glm-5.3-flashx, glm-5.2]
  protocols: [openai_chat, anthropic_messages]
  endpoint_classes: [api, plan, third_party, self_hosted]
source:
  issues: ["vllm-project/vllm#56868"]
  urls:
    - https://github.com/vllm-project/vllm/issues/56868
  first_seen: 2026-10-26
modes: [nonstream]
repeats: 10
request:
  messages:
    - {role: system, content: "You are a coding agent. Use the tools to complete the task."}
    - {role: user, content: "Run the full test suite right now: call run_tests."}
  tools:
    - $ref: fixtures/tools/read_file.json
    - $ref: fixtures/tools/run_tests.json
  tool_choice: auto
  max_tokens: 400
variants:
  - id: ctx-100k
    request: {}
expect:
  default:
    - {check: http_status, equals: 200}
    - {check: finish_reason, in: [tool_calls]}
    - {check: tool_call_count, gte: 1}
    - {check: tool_calls_valid}
    - {check: no_marker_leak}
    - {check: pass_rate_wilson, gte: 0.9}
tolerance: {reference: official_api, margin: {metric: tool_call_rate, delta: -0.1}}
notes: >
  The history is synthetic Claude-Code-shaped read_file turns. Planted defect: long-context-tool-drop (the model
  stops with a one-sentence reply above ~50k tokens).
