# Reference only: cluster profile for GLM on llm-d (P/D disaggregated wide-EP, tiered KV, MTP).
# This is the kit's own profile document. It is NOT an llm-d chart values file: take the manifests from the llm-d
# guide at the pinned release and apply the settings below. Nothing here is applied by the kit.
# llm-d has a GLM-5.2 guide only; no GLM-5.3 guide exists as of 2026-10-26. GLM-5.3 reuses the architecture, but
# treat it as adapted, not as supported by llm-d.
# Sources: https://github.com/llm-d/llm-d (release v1.0.0, guides/models/glm-5-2);
#          https://llm-d.ai/blog/serving-glm-5-2-agentic-workloads-on-llm-d (2026-07-22).
profile: llm-d-cluster
llm_d:
  release: v1.0.0
  guide: guides/models/glm-5-2
  adapted_for: GLM-5.3
engine:
  name: vllm
  image: vllm/vllm-openai:v0.28.0@sha256:61fc8a896b0a4fbbbdc063bc4b0dbc25ce98e02b5050c24aeb7830ac02039b14
model:
  uri: hf://zai-org/GLM-5.3
  served_name: glm-5.3
  weights: fp8
topology:
  # Heavy reference: 64 x H200 over InfiniBand (llm-d blog). Functional minimum for clouds without IB:
  # one prefill worker and one decode worker (p1w1d1w1), 16 GPUs with RDMA. Size both with the calculator.
  gpus_total: 16
  prefill: {replicas: 1, data_parallel: 16, expert_parallel: true}
  decode: {replicas: 1, data_parallel: 16, expert_parallel: true}
  interconnect: rdma
flags:
  common:
    - --kv-cache-dtype=fp8
    - --enable-prefix-caching
    - --speculative-config.method=mtp
    - --speculative-config.num_speculative_tokens=3   # 3 per llm-d practice at high concurrency
    - --enable-auto-tool-choice
    # Parsers pinned per engine. llm-d guide: glm47 tool calls, glm45 reasoning. llm-d issue #2640: most manifests
    # omit parser flags, so tool calls are never emitted. The health check below catches that.
    - --tool-call-parser=glm47
    - --reasoning-parser=glm45
kv_tiering:
  cpu_offload: true
  note: llm-d measured 2,776 vs 951 tok/s at c128 in a 24-GPU run with CPU KV offload
health_check:
  command: glmkit deploy health --target <profile pointing at the gateway> --wait 600
  runs: WIRE-* conformance cases (tool-call and reasoning separation smoke tests belong to slice 02/04)
