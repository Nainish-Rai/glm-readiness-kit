# Same as config.yaml plus LiteLLM's own web-search interception for the zai provider (nothing reimplemented):
# when GLM answers with LiteLLM's web-search tool call, LiteLLM runs the search and re-asks the model.
# Pick a search backend (see LiteLLM docs, "websearch_interception") and export its key.
model_list:
  - model_name: glm-5.3
    litellm_params:
      model: zai/glm-5.3
      api_key: os.environ/ZAI_API_KEY

search_tools:
  - search_tool_name: my-search
    litellm_params:
      search_provider: perplexity          # needs PERPLEXITYAI_API_KEY

litellm_settings:
  callbacks: ["websearch_interception", "glmkit.bridge.litellm_plugin.plugin"]
  websearch_interception_params:
    enabled_providers: ["zai"]
    search_tool_name: my-search
