id: tau2-retail
title: tau2-bench retail, first-tool-call slice
summary: >-
  A single-turn slice of the tau2-bench retail domain. The agent gets the retail policy and the customer's opening
  facts, and must make the right first tool call (look up the customer). It is NOT the full multi-turn benchmark: no
  user simulator, no database-state reward, no pass^k.
task_types: [tool_use]
items: 50
sampling: "every retail task whose first reference action is a customer lookup with arguments stated in the customer's known info (50 of 114 tasks)"
graders:
  tool_use: {type: tool_use, mode: first}
