id: text2sql
title: Text-to-SQL (gretelai synthetic)
summary: Natural-language question plus a table schema; the model writes SQL, graded by executing it and comparing result sets.
task_types: [text_to_sql]
items: 60
sampling: "60 items of the test split whose context and reference SQL execute in SQLite and return rows, random.Random(11)"
graders:
  text_to_sql: {type: sql, ordered: false}
