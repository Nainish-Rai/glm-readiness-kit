id: cuad
title: CUAD contract-clause slice
summary: Clause extraction from contract excerpts (token-F1 span grader) plus a one-sentence explanation graded by a judge.
task_types: [clause_span, clause_explain]
items: 60
sampling: "40 span + 20 explain items from distinct contracts of CUADv1.json (answers 40-500 chars), random.Random(5); each excerpt is a 2,400 character window around the answer"
graders:
  clause_span: {type: span, min_f1: 0.5}
  clause_explain: {type: judge, rubric: "Prefer the explanation that is more accurate to the clause quoted in the reference and clearer for a non-lawyer."}
