name: mock
title: Mock GLM (in-process, OpenAI-compatible, API class)
provider: mock
base_url: "{mock}/api/paas/v4"
protocol: openai_chat
endpoint_class: api
model: glm-5.3
api_key_env: GLMKIT_MOCK_API_KEY
api_key_required: false
spawn_mock: true
notes: The runner starts the mock server in-process on a free port. Use --mock-defect to plant a defect.
