# Versioned price table for the eval engine. Prices are USD per 1M tokens.
# Rule: cost is recomputed from this table and never trusted from the source alone.
# Add your incumbent's models (and host-specific prices) with `glmkit eval run --prices my-prices.yaml`;
# entries of the extra file win over these on the same (provider, model).
version: "2026-10-26"
unit: usd_per_1m_tokens
entries:
